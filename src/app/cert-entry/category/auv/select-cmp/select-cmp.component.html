<div class="field col-12" style="margin-bottom: -0.5rem;" [formGroup]="formGroup">
    <label [for]="fieldName" style="color: #979292;">
        {{fieldLabel}} <span style="color: red;" *ngIf="pageMode === 'EDIT'"> *</span>
    </label>
    <mat-select [id]="fieldName" [formControlName]="fieldName" [compareWith]="showValue"
        *ngIf="pageMode === 'EDIT'"
        (selectionChange)="onChange($event.value)"
        class="w-full text-base text-color surface-overlay p-2 border-1 border-gray-900 surface-border border-round outline-none focus:border-primary">
        <mat-option value="null">Select</mat-option>
        <mat-option *ngFor="let o of lst | keyvalue" [value]="o">
            {{o.value}}
        </mat-option>
    </mat-select>
    <label class="w-full text-base text-color surface-overlay p-2 border-1 border-gray-900 surface-border border-round outline-none focus:border-primary" 
        style="background-color: #f9f9f9; margin-bottom: 0px;" *ngIf="pageMode === 'VIEW'">
        {{fieldValue.value}}
    </label>
    <field-error-component *ngIf="pageMode === 'EDIT'"
        [controlName]="controlName" [formSubmitted]="formSubmitted"></field-error-component>
</div>
