<div class="field col-12" style="margin-bottom: -0.5rem;" [formGroup]="formGroup">
    <label [for]="fieldName" style="color: #979292;">
        {{fieldLabel}} <span style="color: red;" *ngIf="pageMode === 'EDIT' && mandatory"> *</span>
    </label>
    <!-- <mat-form-field class="w-full text-base text-color surface-overlay border-1 border-gray-900 surface-border border-round outline-none focus:border-primary">
    </mat-form-field> -->
    <mat-form-field class="demo-full-width margin-top" [formGroup]="formGroup" *ngIf="pageMode === 'EDIT'">

        <input matInput [matDatepicker] = "picker"
        [formControlName]="fieldName"     
        (dateChange)="onChange($event.value)"  
        *ngIf="!max && !min" 
        readonly class="w-full p-2 text-base text-color surface-overlay border-1 border-gray-900 surface-border border-round outline-none focus:border-primary">
        <input matInput [matDatepicker] = "picker"
        [formControlName]="fieldName"     
        (dateChange)="onChange($event.value)"  
        *ngIf="max && !min" 
        [max]="max"
        readonly class="w-full p-2 text-base text-color surface-overlay border-1 border-gray-900 surface-border border-round outline-none focus:border-primary">
        <input matInput [matDatepicker] = "picker"
        [formControlName]="fieldName"     
        (dateChange)="onChange($event.value)"  
        *ngIf="!max && min" 
        [min]="min"
        readonly class="w-full p-2 text-base text-color surface-overlay border-1 border-gray-900 surface-border border-round outline-none focus:border-primary">
        <input matInput [matDatepicker] = "picker"
        [formControlName]="fieldName"     
        (dateChange)="onChange($event.value)"  
        *ngIf="max && min" 
        [max]="max"
        [min]="min"
        readonly class="w-full p-2 text-base text-color surface-overlay border-1 border-gray-900 surface-border border-round outline-none focus:border-primary">
        <mat-datepicker-toggle matSuffix [for] = "picker" 
        style="float: right; margin-top: -37px;"></mat-datepicker-toggle>
        <mat-datepicker #picker ></mat-datepicker>

    </mat-form-field>
    <label class="w-full text-base text-color surface-overlay p-2 border-1 border-gray-900 surface-border border-round outline-none focus:border-primary" 
        style="background-color: #f9f9f9; margin-bottom: 0px;" *ngIf="pageMode === 'VIEW'">
        {{parseDate(fieldValue)}}
    </label>
    <small *ngIf="helpText">{{helpText}}</small>
    <field-error-component *ngIf="pageMode === 'EDIT'"
        [controlName]="controlName" [formSubmitted]="formSubmitted"></field-error-component>
</div>
