<div class="flex align-items-center justify-content-between">
    <div class="col-12 line-height-1 text-2xl" style="border-bottom: 1px solid grey">
        <a *ngIf="true"
        [routerLink]="['/noc/noc-list']">
            <ion-icon name="arrow-undo"></ion-icon>
        </a>
        {{"page-heading" | transloco}}
        
    </div>
  </div>
  
  <div class="add-lotteryDetails mt-4 pageScroll-bar" *ngIf="dataLoaded">
      <form [formGroup]="form" #localForm="ngForm" (ngSubmit)="isSubmitDisabled = true; onSubmit()">
          <div class="flex align-items-center justify-content-between flex-wrap border-bottom px-3 pt-3">

              <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"label-application-no" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{applicationNo}}
                </label>
            </div>

              <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-applicant-name" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{applicantName}}
                </label>
            </div>
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-applicant-scheme" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{scheme}}
                </label>
            </div>
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-applicant-category" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{category}}
                </label>
            </div>
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-applicant-tenement" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{tenement}}
                </label>
            </div>
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-application-lottery" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{lotteryCode + "-" + lotteryName}}
                </label>
            </div>

            <!-- For Noc Details -->

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-bank-name" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{bankName}}
                </label>
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-branch-name" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{branchName}}
                </label>
            </div>

            <!-- <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-date" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{nocDate}}
                </label>
            </div> -->

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-loan-amount" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{loanAmount}}
                </label>
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-rate-of-intrest" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{rateOfIntrest}}
                </label>
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-tenure-year" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{tenureYear}}
                </label>
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-tenure-months" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                    black;font-weight: 500; min-height: 40px;">
                    {{tenureMonths}}
                </label>
            </div>

            <div *ngIf="cancelNocRejectReason"
                class="field col-12 sm:col-12 md:col-12 lg:col-12">
                <label for="cancelNocRejectReason" style="color: #979292;">
                    {{"cancel-noc-reject-reason" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #d44040; color: 
                    rgb(255, 255, 255);font-weight: 500; min-height: 40px;">
                    {{cancelNocRejectReason}}
                </label>
            </div>

            <div *ngIf="nocStatus === 'REJECTED'"
            class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"view-reject-reason" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #d44040; color: 
                    rgb(255, 255, 255);font-weight: 500; min-height: 40px;">
                    {{rejectReason}}
                </label>
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <button class="btn-medium shadow-4 col-12" style="height: 32px;" (click)="showPaymentSlip()" type="button">
                    <span style="color: white;">{{"view-noc-payment-receipt" | transloco}}</span>                        
                </button>
            </div>
            
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <button class="btn-medium shadow-4 col-12" style="height: 32px;" (click)="showSanctionLetter()" type="button">
                    <span style="color: white;">{{"view-sanction-letter-btn" | transloco}}</span>                        
                </button>
            </div>   

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <button class="btn-medium shadow-4 col-12" *ngIf ="cancelLetterFile && cancelLetterFile !== 'CANCELLED'" 
                    style="height: 32px;" (click)="showCancelLetter()" type="button">
                    <span style="color: white;">{{"view-cancel-letter-btn" | transloco}}</span>                        
                </button>
            </div>
            
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <button 
                *ngIf="nocStatus === 'APPROVED'"
                class="btn-medium shadow-4 col-12" style="height: 32px;" (click)="showNocLetter()" type="button">
                
                    <span style="color: white;">{{"view-noc-letter-btn" | transloco}}</span>     
                                       
                </button>
            </div>
  </div>   
        <div class="flex align-items-center justify-content-between flex-wrap border-bottom px-3 pt-3">
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <button type="button" style="height: 32px;background: red;" (click)="cancelNocRequest()"
                        class="btn-medium shadow-4 col-12 text-white">Request for Cancellation</button>
            </div>
        </div> 




          <div class="col-12 flex justify-content-center align-items-center" *ngIf="isLoading">
              <mat-progress-bar mode="indeterminate"></mat-progress-bar>
          </div>
          <div class="borderBottom">
          </div>
          <!-- <div class="mx-3 py-3 add-btn-mobile mobile-btn">
              <button type="submit" [disabled]="isSubmitDisabled" class="btn btn-secondary mr-3"
                  mat-stroked-button>Submit</button>
              <button type="button" [routerLink]="['/noc/noc-list']" color="primery"
              style="float: right;"
               class="btn btn-primery" mat-raised-button>Go Back</button>
          </div> -->
          
      </form>
  </div>
