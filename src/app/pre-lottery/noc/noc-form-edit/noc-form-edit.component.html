<div class="flex align-items-center justify-content-between">
    <div class="col-12 line-height-1 text-2xl" style="border-bottom: 1px solid grey">
        <a *ngIf="true"
        [routerLink]="['/noc/noc-list']">
            <ion-icon name="arrow-undo"></ion-icon>
        </a>
        {{"page-heading" | transloco}}
        
    </div>
  </div>
  
  <div class="add-lotteryDetails mt-4 pageScroll-bar">
      <form [formGroup]="form" #localForm="ngForm" (ngSubmit)="isSubmitDisabled = true; onSubmit()">
          <div class="flex align-items-center justify-content-between flex-wrap border-bottom px-3 pt-3">
           
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"label-application-no" | transloco}}
                </label><br>
                <input type="text"  id="applicationNo" formControlName="applicationNo" 
                style="background-color: #ffffff;  color: 
                    black;width: 71%;font-weight: 500; min-height: 40px;border: none;padding-left: 1%; "
                value="{{applicationNo}}" required readonly class="form-control focus:border-primary" autocomplete="off" />
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-applicant-name" | transloco}}
                </label><br>
                <input type="text"  id="applicationNo" formControlName="applicantName" 
                style="background-color: #ffffff;   color: 
                    black;width: 71%;font-weight: 500; min-height: 40px;border: none; padding-left: 1%; "
                value="{{applicantName}}" required readonly class="form-control focus:border-primary" autocomplete="off" />
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-applicant-scheme" | transloco}}
                </label><br>
                <input type="text"  id="applicationNo" formControlName="scheme" 
                style="background-color: #ffffff;  color: 
                    black;width: 71%;font-weight: 500; min-height: 40px;border: none; padding-left: 1%; "
                value="{{scheme}}" required readonly class="form-control focus:border-primary" autocomplete="off" />
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-applicant-category" | transloco}}
                </label><br>
                <input type="text"  id="applicationNo" formControlName="category" 
                style="background-color: #ffffff;  color: 
                    black;width: 71%;font-weight: 500; min-height: 40px;border: none; padding-left: 1%; "
                value="{{category}}" required readonly class="form-control focus:border-primary" autocomplete="off" />
            </div>
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                   {{"noc-applicant-tenement" | transloco}}
                </label><br>
                <input type="text"  id="applicationNo" formControlName="tenement" 
                style="background-color:  #ffffff;   color: 
                    black;width: 71%;font-weight: 500; min-height: 40px;border: none;padding-left: 1%;  "
                value="{{tenement}}" required readonly class="form-control focus:border-primary" autocomplete="off" />
            </div>
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                   {{"noc-application-lottery" | transloco}}
                </label><br>
                <input type="text"  id="applicationNo" formControlName="lotteryName" 
                style="background-color:  #ffffff;   color: 
                    black;width: 71%;font-weight: 500; min-height: 40px;border: none; padding-left: 1%; "
                value="{{lotteryName}}" required readonly class="form-control focus:border-primary" autocomplete="off" />
            </div>

            <!-- For Noc Details -->
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-bank-name" | transloco}}
                </label><br>
                <input type="text" id="applicationNo" formControlName="bankName" style="background-color: #DFDFDF;  color: 
                black;width: 71%;font-weight: 500; min-height: 40px;border: none;padding-left: 1%;  "
                value="{{bankName}}" class="form-control focus:border-primary" autocomplete="off" />
                
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-branch-name" | transloco}}
                </label><br>
                <input type="text" id="applicationNo" formControlName="branchName" 
                style="background-color:#DFDFDF;  color: 
                    black;width: 71%;font-weight: 500; min-height: 40px;border: none; padding-left: 1%; "
                value="{{branchName}}" class="form-control focus:border-primary" autocomplete="off" />
                
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-loan-amount" | transloco}}
                </label><br>
                <input type="text"min="0" 
                appFloatOnly
                id="applicationNo" formControlName="loanAmount" 
                style="background-color:#DFDFDF;  color: 
                    black;width: 71%;font-weight: 500; min-height: 40px;border: none;padding-left: 1%;  "
                value="{{loanAmount}}" class="form-control focus:border-primary" autocomplete="off" />
                
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-rate-of-intrest" | transloco}}
                </label><br>
                <input type="text" appNumbersWithFloatOnly pattern="\d{0,5}(\.\d{0,2})?" min="0"   
          
                id="applicationNo" formControlName="rateOfIntrest" 
                style="background-color:#DFDFDF;  color: 
                    black;width: 71%;font-weight: 500; min-height: 40px;border: none;padding-left: 1%;  "
                value="{{rateOfIntrest}}" class="form-control focus:border-primary" autocomplete="off" />
                
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"noc-tenure-year" | transloco}}
                </label><br>
                <input type="text" appNumbersOnly maxlength="2"
                
                id="applicationNo" formControlName="tenureYear" 
                style="background-color:#DFDFDF;  color: 
                    black;width: 71%;font-weight: 500; min-height: 40px;border: none; padding-left: 1%; "
                 class="form-control focus:border-primary" autocomplete="off" />
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                     {{"noc-tenure-months" | transloco}}
                </label><br>
                <input type="text" numberTwoDigitUptoTwelveOnly maxlength="2" min="0" max="12"
                
                id="applicationNo" formControlName="tenureMonths" 
                style="background-color:#DFDFDF;  color: 
                    black;width: 71%;font-weight: 500; min-height: 40px;border: none;padding-left: 1%;  "
                value="{{tenureMonths}}" class="form-control focus:border-primary" autocomplete="off" />
                
            </div>

            <div *ngIf="nocStatus === 'REJECTED'"
            class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="applicationNo" style="color: #979292;">
                    {{"view-reject-reason" | transloco}}
                </label><br>
                <label class="col-12 p-2" style="background-color: #d44040; color: 
                    rgb(255, 255, 255);font-weight: 500; min-height: 40px;">
                    {{rejectReason}}
                </label>
            </div>

            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="file" style="color: #979292; width: max-content;">
                    {{"noc-payment-receipt-upload" | transloco}} <span class="text-red-900">*</span>
                </label><br>
                <button class="btn-medium shadow-4 col-12" style="height: 32px;" (click)="showPaymentSlip()" type="button">
                    <span style="color: white;">{{"view-noc-payment-receipt" | transloco}}</span>                        
                </button>
                <div class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-4 position-relative">
                    <div class="col-12 sm:col-12 md:col-4 lg:col-4 field" style="padding-top: 17px;">
                        
                        <button type="button" (click)="file.click()" style="float: left; width: max-content;" 
                        class="small-button shadow-4 bg-primary text-white p-1">
                        <mat-icon style="line-height: 25px; margin-right: 5px; float: left; color: white;">upload</mat-icon>
                        <div  style="float: left; padding-top: 6px;" 
                        class="text-white"> {{"noc-payment-receipt" | transloco}}
                        </div>
                        <input type="file" [id]="file" #file formControlName="Nocfile"
                            style="display: none;" (change)="onFileSelect($event)" accept="application/pdf"/>
                        </button>
                        <div *ngIf="selectedFile" class="pl-2 pt-2" style="float: left;">
                            <!-- {{"noc-payment-receipt" | transloco}} -->
                            {{selectedFile?.name}}
                        </div>
                    </div>
                    <field-error-component [controlName]="form.get('Nocfile')"
                        [formSubmitted]="localForm.submitted"></field-error-component>
                </div>
            </div>
            
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                <label for="file1" style="color: #979292; width: max-content;">
                    {{"noc-sanction-letter-upload" | transloco}} <span class="text-red-900">*</span>
                </label><br>
                <button class="btn-medium shadow-4 col-12" style="height: 32px;" (click)="showSanctionLetter()" type="button">
                    <span style="color: white;">{{"view-sanction-letter-btn" | transloco}}</span>                        
                </button>
                <div class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-4 position-relative">
                    <div class="col-12 sm:col-12 md:col-4 lg:col-4 field" style="padding-top: 17px;">
                        
                        <button type="button" (click)="file1.click()" style="float: left; width: max-content;" 
                        class="small-button shadow-4 bg-primary text-white p-1">
                        <mat-icon style="line-height: 25px; margin-right: 5px; float: left; color: white;">upload</mat-icon>
                        <div style="float: left; padding-top: 6px;" 
                        class="text-white"> {{"noc-sanction-letter" | transloco}}
                        </div>
                        <input type="file" [id]="file1" #file1 formControlName="sanctionLetterFile"
                            style="display: none;" (change)="onSanctionLetter($event)" accept="application/pdf"/>
                        </button>
                        <div *ngIf="sanctionLetter" class="pl-2 pt-2" style="float: left;">
                            <!-- {{"noc-sanction-letter" | transloco}} -->
                            {{sanctionLetter?.name}}
                        </div>
                    </div>
                    <field-error-component [controlName]="form.get('sanctionLetterFile')"
                        [formSubmitted]="localForm.submitted"></field-error-component>
                </div>
            </div>   
            
            <div class="field col-12 sm:col-6 md:col-6 lg:col-4" *ngIf="haveCancelledNocEntry == true">
                <label for="file2" style="color: #979292; width: max-content;">
                    {{"noc-cancel-letter-upload" | transloco}} <span class="text-red-900">*</span>
                </label><br>
                <button class="btn-medium shadow-4 col-12" style="height: 32px;" (click)="showCancelLetter()" type="button">
                    <span style="color: white;">{{"view-cancel-letter-btn" | transloco}}</span>                        
                </button>
                <div class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-4 position-relative">
                    <div class="col-12 sm:col-12 md:col-4 lg:col-4 field" style="padding-top: 17px;">
                        
                        <button type="button" (click)="file2.click()" style="float: left; width: max-content;" 
                        class="small-button shadow-4 bg-primary text-white p-1">
                        <mat-icon style="line-height: 25px; margin-right: 5px; float: left; color: white;">upload</mat-icon>
                        <div style="float: left; padding-top: 6px;" 
                        class="text-white"> {{"noc-cancel-letter" | transloco}}
                        </div>
                        <input type="file" [id]="file2" #file2 formControlName="cancelLetterFile"
                            style="display: none;" (change)="onCancelLetter($event)" accept="application/pdf"/>
                        </button>
                        <div *ngIf="cancelLetter" class="pl-2 pt-2" style="float: left;">
                            {{cancelLetter?.name}}
                        </div>
                    </div>
                    <field-error-component [controlName]="form.get('cancelLetterFile')"
                        [formSubmitted]="localForm.submitted"></field-error-component>
                </div>
            </div>  

            <div class="mx-3 py-3" style="float: right;">
                <button type="submit" [disabled]="isSubmitDisabled" class="btn btn-secondary mr-3" style="height: 44px;"
                    mat-stroked-button>Submit</button>
                <button type="button" [routerLink]="['/noc/noc-list']" color="primery" class="btn btn-primery" style="height: 44px; background-color: #fc5305;"
                    mat-raised-button>Cancel</button>
            </div>

            

          
  </div>    
          





          <div class="col-12 flex justify-content-center align-items-center" *ngIf="isLoading">
              <mat-progress-bar mode="indeterminate"></mat-progress-bar>
          </div>
          <div class="borderBottom">
          </div>
          <!-- <div class="mx-3 py-3 add-btn-mobile mobile-btn">
              <button type="submit" [disabled]="isSubmitDisabled" class="btn btn-secondary mr-3"
                  mat-stroked-button>Submit</button>
              <button type="button" [routerLink]="['/noc/noc-list']" color="primery"
              style="float: right;"
               class="btn btn-primery" mat-raised-button>Go Back</button>
          </div> -->
          
      </form>
  </div>
