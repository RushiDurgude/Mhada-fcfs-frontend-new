<div class="grid m-0 pl-3 pt-2 pr-3 background-image card-content ng-star-inserted" 
    style="height: calc(100% - 100px);" *ngIf="loaded">
<div class="col-12 p-0 card">
    <div class="col-12">
        <div class="col-12 line-height-1 text-2xl" style="border-bottom: 1px solid grey">
            <a [routerLink]="['/app', 'application-detail-lists', 'post-apps']">
                <ion-icon name="arrow-undo"></ion-icon>
            </a>
            {{"title-caste-validity-ref-letter" | transloco}}
        </div>
        
        <div class="col-12 p-0 mt-2">
            <div class="grid p-2">
                <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                    <label for="applicationNo" style="color: #979292;">
                        {{"label-selected-applicationno" | transloco}}
                    </label><br>
                    <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                        black;font-weight: 500; min-height: 40px;">
                        {{applicationNo}}
                    </label>
                </div>
                <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                    <label for="applicantName" style="color: #979292;">
                        {{"label-selected-applicantname" | transloco}}
                    </label><br>
                    <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                        black;font-weight: 500; min-height: 40px;">
                        {{applicantName}}
                    </label>
                </div>
                <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                    <label for="category" style="color: #979292;">
                        {{"label-selected-category" | transloco}}
                    </label><br>
                    <label class="col-12 p-2" style="background-color: #DFDFDF; color: 
                        black;font-weight: 500; min-height: 40px;">
                        {{categoryCode}} - {{categoryName}}
                    </label>
                </div>
                <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                    <label for="districtName" style="color: #979292;">
                        {{"label-selected-districtname" | transloco}}
                    </label><br>
                    <select id="districtName" 
                        [(ngModel)]="districtName"
                        class="w-full text-base text-color surface-overlay p-2 border-1 border-gray-900 surface-border border-round outline-none focus:border-primary" 
                        style="appearance: auto">
                        <option value="">{{"option-select" | transloco}}</option>
                        <option *ngFor="let district of districts" [value]="district">{{district}}</option>
                    </select>
                </div>
                <div class="field col-12 sm:col-6 md:col-6 lg:col-4" *ngIf ="gender === 'FEMALE' && maritalStatus === 'Married'">
                    <label for="nameBfrMarrg" class="label-input">
                        {{"name-before-marraige" | transloco}}<span class="text-red-900">*</span>
                    </label><br>
                    <input class ="col-12 p-2" type="text" style="min-height: 40px;" 
                        id="nameBfrMarrg" [(ngModel)]="nameBfrMarrg" required pattern="[a-zA-Z-]+"/>
                </div>
                <div class="field col-12 sm:col-6 md:col-6 lg:col-4"*ngIf ="gender === 'FEMALE' && maritalStatus === 'Married'">
                    <label for="nameAftrMarrg" class="label-input">
                        {{"name-after-marraige" | transloco}}<span class="text-red-900">*</span>
                    </label><br>
                    <input class ="col-12 p-2" type="text" style="min-height: 40px;" 
                        id="nameAftrMarrg" [(ngModel)]="nameAftrMarrg" required pattern="[a-zA-Z-]+"/>
                </div>  
                <div class="field col-12 sm:col-6 md:col-6 lg:col-4" *ngIf="gender === 'FEMALE' && maritalStatus === 'Married'">
                    <div class="col-12 sm:col-12 md:col-4 lg:col-4 field" style="padding-top: 17px;">
                        <label for="file1" style="color: #979292; width: max-content;">
                            {{"upload-marriage-nameChange-file" | transloco}} <span class="text-red-900">*</span>
                        </label><br>
                        <button type="button" (click)="file1.click()" style="float: left; width: max-content;" 
                        class="small-button shadow-4 bg-primary text-white p-1">
                        <mat-icon style="line-height: 25px; margin-right: 5px; float: left; color: white;">upload</mat-icon>
                        <div style="float: left; padding-top: 6px;" 
                        class="text-white"> {{"marriage-nameChange-file" | transloco}}
                        </div>
                        <input type="file" [id]="file1" #file1 formControlName="mrriageNameChangeFile"
                            style="display: none;" (change)="onFileSelect($event)" accept="application/pdf"/>
                        </button>
                        <div *ngIf="selectedFile" class="pl-2 pt-2" style="float: left;">
                            {{selectedFile?.name}}
                        </div>
                    </div>
                    <!-- <field-error-component [controlName]="form.get('mrriageNameChangeFile')"
                        [formSubmitted]="localForm.submitted"></field-error-component> -->
                </div>     
                <div class="col-12 p-2 mt-6 mb-3">
                    <button class="btn-medium shadow-4 mt-0" 
                        type="button" (click)="isApplyDisabled = true; submit();">
                        {{"button-submit" | transloco}}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
