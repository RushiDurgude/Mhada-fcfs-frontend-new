<div class="grid m-0 p-0 background-image card-content ng-star-inserted" 
    style="min-height: 87.5%;">
<div class="col-11 m-3 p-0 card">
    <div class="col-12">
        <div class="col-12 line-height-1 text-2xl" style="border-bottom: 1px solid grey">
            {{"title-header-news" | transloco}}
        </div>
        <div class="col-12 p-0 mt-2" *ngIf="news">
            <div class="col-12 p-0 mt-2 border-1 border-gray-400 shadow-2 border-round-x1" 
                *ngFor="let newsItem of news">
                <div class="col-12 p-2 font-bold"
                    style="border-left: 6px solid #fbb73c;
                    border-radius: 10px;
                    border-bottom: 4px solid #69d369;"
                    >
                    {{lang === 'mr' ? newsItem?.announcementMr : newsItem?.announcementEn}}
                </div>
            </div>
            <div class="col-12 p-3 mt-2 border-1 border-gray-400 shadow-2 border-round-x1"
                *ngIf="dataLoaded && (!news || news.length === 0)">
                {{"message-news-empty" | transloco}}
            </div>
        </div>
    </div>
</div>
</div>
