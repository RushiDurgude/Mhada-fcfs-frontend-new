<ion-content class="p-1">
    <swiper [config]="config" #swiper>
      <ng-template swiperSlide>
        <div class="swiper-zoom-container">
          <img [src]="img" />
        </div>
      </ng-template>
    </swiper>
</ion-content>
<ion-footer>
  <ion-row>
    <ion-col size="4" class="ion-text-center">
      <ion-button (click)="zoom(false)" fill="clear" color="light" style="width: auto; background: none;">
        <ion-icon name="remove" slot="start" style="color: white; font-weight: bold;"></ion-icon>
      </ion-button>
    </ion-col>
    <ion-col size="4" class="ion-text-center">
      <ion-button (click)="close()" fill="clear" color="light" style="width: auto; background: none;">
        <ion-icon name="close" slot="start" style="color: white; font-weight: bold;"></ion-icon>
      </ion-button>
    </ion-col>
    <ion-col size="4" class="ion-text-center">
      <ion-button (click)="zoom(true)" fill="clear" color="light" style="width: auto; background: none;">
        <ion-icon name="add" slot="start" style="color: white; font-weight: bold;"></ion-icon>
      </ion-button>
    </ion-col>
  </ion-row>
</ion-footer>
