<ion-header>
    <ion-toolbar>
        <ion-buttons slot="end">
            <ion-icon name="close-circle-sharp" 
                (click)="onCancel()" style="color: red;font-size: 26px;"></ion-icon>
        </ion-buttons>
        <ion-title class="pl-3">{{headingLabel}}</ion-title>
    </ion-toolbar>
</ion-header>
<ion-content class="p-1">
    <div class="grid col-12" id="print-wrapper">
        <div class="grid col-12 pb-3 mb-3 pt-3">
            <form [formGroup]="form" #localForm="ngForm" (ngSubmit)="onSubmit()" class="grid col-12">
                <div class="col-12 p-0">
                    <div class="col-12" style="padding-top: 17px;">
                        <label style="color: #979292;">
                            {{"enter-reason" | transloco}}{{remarkLabel}}
                        </label><br>
                        <textarea class="text-base text-color surface-overlay p-2 border-1 
                            border-gray-900 surface-border border-round appearance-none outline-none 
                            focus:border-primary w-full" rows="3" 
                            formControlName="remark"></textarea>
                            <field-error-component [controlName]="form.get('remark')" [formSubmitted]="localForm.submitted"></field-error-component>
                    </div>
                    <div class="col-12">
                        <button type="button" (click)="file1.click()"
                            class="btn shadow-4 bg-primary text-white mt-2">
                            <mat-icon style="float: left; color: white">upload</mat-icon>
                                {{ "upload" | transloco }}{{uploadBtnLabel}}
                            <input type="file" [id]="file1" #file1 style="display: none"
                            (change)="cancelNocLtrUpload($event)"
                            accept="application/pdf"/>
                        </button>{{cancelNocLetter?.name}}
                    </div>
                </div> 
                <div class="col-12">
                    <br>
                    <button type="submit"
                        class="btn shadow-4 bg-primary text-white mt-2">Submit</button>
                </div>
            </form>
        </div>
    </div>
</ion-content>
