<div class="add-lotteryDetails">
  <!-- pageScroll-bar mt-1 -->
  <form
    [formGroup]="form"
    #localForm="ngForm"
    (ngSubmit)="isSubmitDisabled = true; onSubmit()"
  >
    <div
      class="flex align-items-center justify-content-between flex-wrap border-bottom px-3 pt-3"
    >
      <div
        class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-4 position-relative"
        style="color: black"
      >
        <label for="currentMaritalStatus" class="label-input">
          {{ "marriage-status" | transloco }}
          <span class="text-red-900">*</span> </label
        ><br />

        <h3>
          <span style="background-color: orange; color: white">{{
            data?.marriageStatus
          }}</span>
        </h3>
      </div>
      <div
        class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-4 position-relative"
        style="color: black"
      >
        <label for="newMaritalStatus" class="label-input">
          {{ "new-marriage-status" | transloco }}
          <span class="text-red-900">*</span>
        </label>
        <mat-select
          id="newMaritalStatus"
          formControlName="newMaritalStatus"
          class="form-control select-dropdwon"
          (selectionChange)="onSelectionChange($event.value)"
        >
          <mat-option value="">{{ "select" | transloco }}</mat-option>
          <mat-option
            *ngFor="let o of data?.newMaritalStatus | keyvalue"
            [value]="o"
          >
            {{ o.value }}
          </mat-option>
        </mat-select>
        <field-error-component
          [controlName]="form.get('newMaritalStatus')"
          [formSubmitted]="localForm.submitted"
          class="position-absolute block"
        >
        </field-error-component>
      </div>

      <div
        class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-4 position-relative"
        style="color: black"
      ></div>

      <div
        class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-2 position-relative"
        style="color: black"
        *ngIf="form.value.newMaritalStatus.value == 'Married'"
      >
        <label for="spouseName" class="label-input">
          {{ "spouse-name" | transloco }} <span class="text-red-900">*</span>
        </label>
        <input
          type="text"
          id="spouseName"
          formControlName="spouseName"
          class="form-control"
          autocomplete="off"
          maxlength="180"
        />
        <field-error-component
          [controlName]="form.get('spouseName')"
          [formSubmitted]="localForm.submitted"
          class="position-absolute block"
        >
        </field-error-component>
      </div>
      <div
        class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-2 position-relative"
        style="color: black"
        *ngIf="form.value.newMaritalStatus.value == 'Married'"
      >
        <label for="spousePan" class="label-input">
          {{ "spouse-pan" | transloco }} <span class="text-red-900">*</span>
        </label>
        <input
          type="text"
          id="spousePan"
          formControlName="spousePan"
          class="form-control"
          autocomplete="off"
          maxlength="10"
          onkeypress="return /[0-9a-zA-Z]/i.test(event.key)"
        />
        <field-error-component
          [controlName]="form.get('spousePan')"
          [formSubmitted]="localForm.submitted"
          class="position-absolute block"
        >
        </field-error-component>
      </div>

      <div
        class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-2 position-relative"
        style="color: black"
        *ngIf="form.value.newMaritalStatus.value == 'Married'"
      >
        <label for="spouseAadhaar" class="label-input">
          {{ "spouse-aadhar" | transloco }} <span class="text-red-900">*</span>
        </label>
        <input
          type="text"
          inputmode="numeric"
          id="spouseAadhaar"
          formControlName="spouseAadhaar"
          class="form-control"
          autocomplete="off"
          maxlength="12"
          onkeypress="return /[0-9,]/i.test(event.key)"
        />
        <field-error-component
          [controlName]="form.get('spouseAadhaar')"
          [formSubmitted]="localForm.submitted"
          class="position-absolute block"
        >
        </field-error-component>
      </div>

    <div class="mx-3 py-3 add-btn-mobile mobile-btn">
      <button
        type="submit"
        [disabled]="isSubmitDisabled"
        class="btn btn-secondary mr-3"
        mat-stroked-button
      >
        <span style="color: #f27900"> Submit </span>
      </button>
      <button
        type="button"
        [routerLink]="['/app', 'application-detail-list']"
        color="primery"
        class="btn btn-primery"
