          <div class="image-preview-container">
            <div class="preview">
              <img
                height="230px"
                width="250px"
                id="preview-selected-image-applicant"
              />
            </div>
            <label for="file">
              <mat-icon
                style="
                  line-height: 25px;
                  margin-right: 5px;
                  float: left;
                  color: white;
                "
                >cloud_upload</mat-icon
              >
              {{ "photo-file" | transloco }}</label
            >
            <input
              type="file"
              id="file"
              #file
              accept=".jpg, .jpeg, .png"
              formControlName="file"
              (change)="handleFileInput($event)"
