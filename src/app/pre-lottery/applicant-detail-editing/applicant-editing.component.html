<div class="add-lotteryDetails mt-4 pageScroll-bar">
  <form [formGroup]="form" #localForm="ngForm">
    <!-- (ngSubmit)="isSubmitDisabled = true; onSubmit()" -->
    <div
      class="flex align-items-center justify-content-between flex-wrap border-bottom px-3 pt-3"
    >
      <div
        class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-4 position-relative"
      >
        <label class="cursor-pointer pt-2">
          <br />
          {{ "change-applicant-details-label" | transloco }}
          <!-- Do you want to change applicant details ? -->
        </label>
      </div>

      <div
        class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-4 position-relative"
      >
        <label class="cursor-pointer pt-2">
          <br />
          <mat-radio-group>
            <mat-radio-button
              value="Photo"
              (change)="toggleChild($event)"
              [checked]="selectedChild === 'Photo'"
            >
              {{ "applicant-photo" | transloco }}</mat-radio-button
            >
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <mat-radio-button
              value="Marital Status"
              (change)="toggleChild($event)"
              [checked]="selectedChild === 'Marital Status'"
            >
              {{ "marriage-status" | transloco }}</mat-radio-button
            >
          </mat-radio-group>
        </label>
      </div>

      <div
        class="col-12 pl-0 md:col-4 md:pr-3 pr-0 pt-0 pb-4 position-relative"
      >
        <label class="cursor-pointer pt-2">
          <br />
        </label>
      </div>
    </div>
    <div
      class="col-12 flex justify-content-center align-items-center"
      *ngIf="isLoading"
    >
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
    <div class="borderBottom"></div>
    <div class="mx-3 py-3 add-lotteryDetails">
      <div *ngIf="selectedChild === 'Photo'">
        <photo-upload [selectedChild]="selectedChild"></photo-upload>
      </div>
      <div *ngIf="selectedChild === 'Marital Status'">
        <app-marriage-status
          [selectedChild]="selectedChild"
        ></app-marriage-status>
      </div>
    </div>
  </form>
</div>
