<ion-header>
    <ion-toolbar>
      <ion-buttons slot="end">
          <ion-icon name="refresh-outline" 
              (click)="clearPad()" 
              style="background-color: orange; font-size: 26px; color: white; border-radius: 30px; margin-right: 20px; cursor: pointer;"></ion-icon>
      </ion-buttons>
      <ion-buttons slot="end">
        <ion-icon name="save-outline" 
            (click)="savePad()" 
            style="color: green; font-size: 26px; margin-right: 20px; cursor: pointer;"></ion-icon>
      </ion-buttons>
      <ion-buttons slot="end">
          <ion-icon name="close-circle-sharp" 
              (click)="cancel()" style="color: red;font-size: 26px;"></ion-icon>
      </ion-buttons>
      <ion-title class="pl-3">{{"title-signature" | transloco}}</ion-title>
    </ion-toolbar>
</ion-header>
<ion-content class="p-1">
  <!-- <h4 class="col-12" style="text-align: center;" *ngIf="platform === 'browser' || platform === 'browser-local'">Draw Signature</h4> -->
  <div #canvasContainer style="display: flex; justify-content: center; width: 100%; height: 100%; padding-top: 10px; background-color: #DFDFDF;">
    <canvas #canvas (touchstart)="startDrawing($event)" (touchmove)="moved($event)"
    style="width: 500px; height: 250px; background-color: white;" *ngIf="platform === 'browser' || platform === 'browser-local'"></canvas>
    <canvas #canvas (touchstart)="startDrawing($event)" (touchmove)="moved($event)"
    style="width: 75%; height: 80%; background-color: white;" *ngIf="platform !== 'browser' && platform !== 'browser-local'"></canvas>
  </div>
  <!-- <h4 class="col-12" style="text-align: center;">Or Upload your Signature</h4>
  <div style="display: flex; justify-content: center;" *ngIf="platform === 'browser' || platform === 'browser-local'">
    <div class="col-12">
      <small>Please sign on a white paper and upload image.</small>

    </div>
  </div> -->
</ion-content>
