<div mat-dialog-content>
  <div class="grid m-0 p-0">
    <div class="col-10 text-xl">e-Sign Document</div>
    <div class="col-2 text-right text-xl">
      <ion-icon name="close-outline" mat-dialog-close></ion-icon>
    </div>
    <div class="col-12 pdf-downloaded" *ngIf="pdfDownloaded">PDF Downloaded</div>
    <div class="col-12 text-right" *ngIf="!pdfDownloaded">
      <button mat-raised-button (click)="downloadPdf()">
        <ion-icon name="cloud-download" style="font-size: 20px"></ion-icon> Download
      </button>
    </div>
    <div class="col-12">
      <pdf-viewer
        #pdf
        [src]="pdfSrc"
        [render-text]="true"
        [original-size]="false"
        style="width: 100%; height: 451px"
      ></pdf-viewer>
    </div>
  </div>
</div>
