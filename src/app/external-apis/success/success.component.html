<!-- eslint-disable @angular-eslint/template/eqeqeq -->
<div class="grid m-0 p-0 p-3">
  <div class="col-12 lg:col-1 xl:col-1 md:col-1 file-upload-container text-center"></div>
  <div class="col-12 lg:col-10 xl:col-10 md:col-10 file-upload-container text-center">
    <div class="grid card">
      <div class="col-12 line-height-4 text-xl text-left">
        <div style="border-bottom: 1px solid grey">e-Sign Self Declaration</div>
      </div>
      <div class="col-12">
        <div class="grid">
          <div class="col-12">
            <div class="grid">
              <div class="col-12">
                <pdf-viewer
                  *ngIf="isVisible"
                  [src]="pdfSrc"
                  [render-text]="true"
                  [original-size]="false"
                  style="width: 100%; height: 451px"
                ></pdf-viewer>
              </div>
            </div>
          </div>
          <div class="col-12 text-right">
            <button class="active-button">DONE</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 lg:col-1 xl:col-1 md:col-1 file-upload-container text-center"></div>
</div>
