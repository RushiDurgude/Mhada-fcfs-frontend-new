<div class="center">
  <div class="grid content" style="margin: 0; padding: 0">
    <div class="col-12" style="margin: 0; padding: 0; width: 100%; text-align: center; background-color: red">
      <svg class="cross mt-1" width="100" height="100" viewBox="0 0 100 100">
        <circle class="cross-disc" cx="50" cy="50" r="50" fill="white"></circle>
        <path
          class="cross-line"
          d="M65 33L35 66"
          fill="none"
          stroke="red"
          stroke-width="3"
          stroke-linecap="round"
        ></path>
        <path
          class="cross-line"
          d="M65 66L35 33"
          fill="none"
          stroke="red"
          stroke-width="3"
          stroke-linecap="round"
        ></path>
      </svg>
    </div>
    <div
      class="col-12"
      style="
        text-align: center;
        font-size: 20px;
        letter-spacing: 1px;
        color: white;
        width: 100%;
        margin-left: -0rem;
        background-color: red;
      "
    >
      AUTHENTICATION FAILED
    </div>

    <div class="col-12 text-center">
      <div class="grid" style="text-align: center; background-color: white">
        <div class="col-12">
          <button
            mat-raised-button
            mat-dialog-close
            [autofocus]="false"
            routerLink="/profile"
            style="
              background-color: white;
              color: black;
              border-radius: 20px;
              width: 220px;
              font-weight: normal;
              line-height: 40px;
              font-size: 20px;
              margin-bottom: 1rem;
              margin-top: 1rem;
            "
          >
            CONTINUE
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
