<div class="grid m-0 p-0 background-image card-content" style="overflow: auto; height: calc(100% - 100px)">
  <div class="col-12 lg:col-4 xl:col-4 md:col-1 file-upload-container text-center"></div>
  <div class="col-12 lg:col-4 xl:col-4 md:col-10 pl-3 pr-3 pb-0" #target [ngClass]="platform == 'ios' ? 'mb-6' : ''">
    <div class="grid m-0 p-0 card">
      <div class="col-12 text-center line-height-4 text-xl font-medium" style="border-bottom: 1px solid grey">
        {{ "label-forgot-password" | transloco }}
      </div>
      <div class="col-12 mt-3 vertical-center" *ngIf="signUpPanVerified">
        <div class="grid text-left">
          <div class="col-12">
            <label>{{ "pan" | transloco }}</label>
          </div>
          <div class="col-12">
            <input class="input input-otp w-full" type="text" maxlength="10" [(ngModel)]="signUpPanNo" required
              style="text-transform: uppercase" onchange="this.value = this.value.toUpperCase();" />
          </div>
          <div class="col-12 text-center" *ngIf="!contentVisible">
            <button [disabled]="signUpPanNo == '' || signUpPanNo.length < 10"
              [ngClass]="signUpPanNo == '' || signUpPanNo.length < 10 ? 'disabled-button-1' : 'active-button-1'"
              (click)="sendOtp()">
              {{ "label-send-login-otp" | transloco }}
            </button>
          </div>
        </div>

        <div class="col-12 text-left" *ngIf="contentVisible">
          <div class="grid text-left">
            <div class="col-12">
              <div class="grid">
                <div class="col-12 text-xs">
                  <label>{{ "forgotPasswordOtpLabel" | transloco }}</label>
                </div>
                <div class="col-12">
                  <input class="input input-otp w-full" type="text" inputmode="numeric" maxlength="8" id="fileupload"
                    [(ngModel)]="emailOtp" (keypress)="numberOnly($event)" />
                </div>
              </div>
            </div>

            <!-- Change By Lucifer For ASVC Start -->
            <div class="col-12 vertical-center">
              <div class="grid text-left">
                <div class="col-12">
                  <label>{{ "label-password" | transloco }}</label>
                </div>
                <div class="col-12">
                  <input class="input input-otp w-full" type="password" maxlength="20" [(ngModel)]="signUpPassword"
                    [pattern]="passwordPattern" required name="newPwd" #newPwd="ngModel" />
                  <div *ngIf="newPwd.errors">
                    <div *ngIf="newPwd.errors?.['pattern']" class="ui-g-12 ui-lg-12 ui-md-12">
                      <p style="color: red">{{ "passwordError" | transloco }}</p>
                    </div>
                  </div>
                </div>
              </div>
              <div class="grid text-left">
                <div class="col-12">
                  <label>{{ "label-confirm-password" | transloco }}</label>
                </div>
                <div class="col-12">
                  <input class="input input-otp w-full" [disabled]="signUpPassword == ''" type="password" maxlength="20"
                    [(ngModel)]="signupConfirmPassword" required />
                  <div *ngIf="signUpPassword != '' && signupConfirmPassword != ''">
                    <div *ngIf="signUpPassword !== signupConfirmPassword" class="ui-g-12 ui-lg-12 ui-md-12">
                      <p style="color: red">{{"password-does-not-match-label" | transloco}}</p>
                    </div>
                  </div>
                </div>
              </div>
              <div class="grid">
                <div class="col-12 mt-3 text-center">
                  <button [disabled]="newPwd.errors || signUpPassword !== signupConfirmPassword" [ngClass]="
                      newPwd.errors || signUpPassword !== signupConfirmPassword ? 'disabled-button-1' : 'active-button-1'
                    " (click)="updatePassword()">
                    {{ "next" | transloco }}
                  </button>
                </div>
              </div>
            </div>

            <!-- Change By Lucifer For ASVC End -->

          </div>
          <div class="grid">

            <!-- Change By Lucifer For ASVC Start -->

            <!-- <div class="col-12 text-center">

                {{ "verify" | transloco }}
              </button>
            </div> -->

                *ngIf="isResendOtpButtonVisible"
              >
                {{ "resend-otp" | transloco }}
              </div>
            </div> -->
          </div>
        </div>
      </div>
