<div class="grid m-0 p-0 background-image card-content" style="overflow: auto; height: calc(100% - 100px)">
  <div class="col-12 lg:col-1 xl:col-1 md:col-1 file-upload-container text-center"></div>
  <div class="col-12 lg:col-10 xl:col-10 md:col-10 pl-3 pr-3 pb-0" #target [ngClass]="platform == 'ios' ? 'mb-6' : ''">
    <div class="grid m-0 p-0 card" *ngIf="isVisible">
      <mat-tab-group class="w-full" [selectedIndex]="0">
        <mat-tab [label]="'label-login' | transloco">
          <app-login></app-login>
        </mat-tab>
        <mat-tab [label]="'label-signup' | transloco"> <app-signup></app-signup> </mat-tab>
      </mat-tab-group>
    </div>
  </div>
  <div class="col-12 lg:col-1 xl:col-1 md:col-1 file-upload-container text-center"></div>
</div>
