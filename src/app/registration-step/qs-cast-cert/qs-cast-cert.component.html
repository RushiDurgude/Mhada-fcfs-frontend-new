<div class="col-12">
  <div class="col-12">
    <div class="grid">
      <div class="col-12 text-base">
        <div class="grid">
          <div class="col-12 lg:col-12 xl:col-12" *ngIf="rejectReason">
            {{"reject-reason" | transloco}} - <span style="color: red;">{{rejectReason}}</span>
          </div>
          <app-file-upload-cmp [uploadFileVisible]="uploadFileVisible" 
            [selectedImage]="selectedImage" [questionCode]="questionCode" 
            [ocrToBeDone]="ocrToBeDone" (evaluateProceedFn)="evaluateProceed()" (setOcrEntryKey)="setOcrEntryKey($event)"
            (setSelectedImage)="setSelectedImage($event)" (setOcrStatus)="setOcrStatus($event)"
            (setFileObj)="setFileObj($event)" [ocrFn]="callOcr"
            class="col-12"></app-file-upload-cmp>
        </div>
      </div>
      <div class="col-12 text-right">
        <button [style.fontWeight]="activeLang == 'mr' ? '600' : ''"
          [style.fontSize]="activeLang == 'mr' ? '18px' : ''" 
          [ngClass]="
            proceedEnabled == false
              ? 'disabled-button'
              : 'active-button flex-end'
          " [disabled]="proceedEnabled == false" (click)="proceed()" style="align-self:flex-end;">
          {{ "proceed" | transloco }}
        </button>
      </div>
    </div>
  </div>
</div>
