<div class="col-12">
  <div class="col-12">
    <div class="grid">
      <div class="col-12 text-base">
        <div class="grid">
          <div class="col-12 lg:col-12 xl:col-12">
            <ion-radio-group [(ngModel)]="selectedRadioOption" (ngModelChange)="radioButtonClicked($event)">
              <div class="grid">
                <div class="col-12 m-0 p-0 sm:col-6 md:col-4 lg:col-2">
                  <ion-item class="ion-no-padding" style="--padding-end: 0px;--inner-padding-end: 0px;">
                    <ion-label>&nbsp;&nbsp;&nbsp;{{"unmarried-label" | transloco}}</ion-label>
                    <ion-radio mode="md" slot="start" value="Unmarried"></ion-radio>
                  </ion-item>
                </div>
                <div class="col-12 m-0 p-0 sm:col-6 md:col-4 lg:col-2">
                  <ion-item class="ion-no-padding" style="--padding-end: 0px;--inner-padding-end: 0px;">
                    <ion-label>&nbsp;&nbsp;&nbsp;{{"married-label" | transloco}}</ion-label>
                    <ion-radio mode="md" slot="start" value="Married"></ion-radio>
                  </ion-item>
                </div>
                <div class="col-12 m-0 p-0 sm:col-6 md:col-4 lg:col-2">
                  <ion-item class="ion-no-padding" style="--padding-end: 0px;--inner-padding-end: 0px;">
                    <ion-label>&nbsp;&nbsp;&nbsp;{{"divorcee-label" | transloco}}</ion-label>
                    <ion-radio mode="md" slot="start" value="Divorcee"></ion-radio>
                  </ion-item>
                </div>
                <div class="col-12 m-0 p-0 sm:col-6 md:col-4 lg:col-3">
                  <ion-item class="ion-no-padding" style="--padding-end: 0px;--inner-padding-end: 0px;">
                    <ion-label>&nbsp;&nbsp;&nbsp;{{"widow-widower-label" | transloco}}</ion-label>
                    <ion-radio mode="md" slot="start" value="Widow"></ion-radio>
                  </ion-item>
                </div>
                <div class="col-12 m-0 p-0 sm:col-6 md:col-4 lg:col-2">
                  <ion-item class="ion-no-padding" style="--padding-end: 0px;--inner-padding-end: 0px;">
                    <ion-label>&nbsp;&nbsp;&nbsp;{{"Separated-label" | transloco}}</ion-label>
                    <ion-radio mode="md" slot="start" value="Separated"></ion-radio>
                  </ion-item>
                </div>
              </div>
              &nbsp;&nbsp;&nbsp;
            </ion-radio-group>
          </div>
        </div>
      </div>
      <div class="col-12 lg:col-12 xl:col-12 ng-star-inserted" *ngIf="selectedRadioOption == 'Married'">
        <p>
          {{"spouse-pan-link-to-digi" | transloco}}
          <a href="https://www.digilocker.gov.in/login" target="_blank">{{"digilocker-website" | transloco}}</a>.
        </p>
      </div>
      <div class="col-12 text-right mt-4">
        <button [style.fontWeight]="activeLang == 'mr' ? '600' : ''"
          [style.fontSize]="activeLang == 'mr' ? '18px' : ''" 
          [ngClass]="
            proceedEnabled == false
              ? 'disabled-button'
              : 'active-button flex-end'
          " [disabled]="proceedEnabled == false" (click)="proceed()" style="align-self:flex-end;">
          {{ "proceed" | transloco }}
        </button>
      </div>
    </div>
  </div>
</div>
