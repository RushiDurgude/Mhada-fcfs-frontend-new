<div class="grid col-12 text-center m-0 p-0 ng-star-inserted" *ngIf="uploadFileVisible">
    <div class="col-12 card-border-dashed text-center m-0 p-0 mt-0">
      <div class="grid">
        <div class="col-12 line-height-4" *ngIf="ocrStatus">{{ocrSuccessMessage}}</div>
      </div>
      <div class="col-12 error-message" *ngIf="errorMessageVisible">
        {{"only-image-is-allowed" | transloco}}.
      </div>
      <div class="col-12" *ngIf="selectedImage == ''">
        <div class="grid" style="min-height: 200px; max-height: fit-content;">
          <div class="col-12 file-upload-container cursor-pointer" (click)="presentActionSheet()">
            <div class="grid centered-card-content text-center m-0 p-0">
              <div class="col-12"><img src="assets/file-upload.png"></div>
              <div class="col-12">
                <label class="underline cursor-pointer">{{"browseAndUpload" | transloco}}</label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 text-center" *ngIf="selectedImage != ''">
        <div class="grid">
          <div class="col-12">
            <img [src]="sanitizeUrl(selectedImage)" class="selected-image-to-upload" />
            <button (click)="reUploadFile()" class="p-2 bg-white border-1 shadow-2 font-medium -ml-6 md:-ml-4 lg:-ml-4 xl:-ml-4" style="vertical-align: top; border-radius: 3rem;" 
              title="{{ 're-upload' | transloco }}" *ngIf="(selectedImage != '' || reUploadFileVisible) && isReUploadFileAllowed">
                <ion-icon name="pencil" slot="start" class="ml-1"></ion-icon>
                {{ 're-upload' | transloco }}
            </button>
          </div>
        </div>
      </div>
    </div>
</div>
<input type="file" id="fileupload" accept="image/png,image/jpeg,image/jpg" style="display: none"
    (change)="handleFileInput($event)" *ngIf="fileUploadT" />
