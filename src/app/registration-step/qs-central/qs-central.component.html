<div class="col-12">
  <div class="col-12">
    <div class="grid">
      <div class="col-12 text-base">
        <div class="grid">
          <div class="col-12 lg:col-12 xl:col-12 p-0">
            <div class="grid m-0 p-0">
              <div class="col-12 p-0">
                <p [innerHTML]="'cidco-question-label-content-1' | transloco"></p>
                <!-- If you are <b>Central Govt. Employee</b>, you need to generate <b>Central Govt. Employee</b> certificate from the system. Get it signed stamped from the competent authority and upload it in the below box. -->
              </div>
              <div class="col-12 p-0">
                {{"central-generate-certificate" | transloco }}<b>{{"central-question-label-content-2" | transloco}}</b>{{"lbl-cert-entry-tbl-header" | transloco}} - <a (click)="routeToCertEntryFn()" class="cursor-pointer">{{"button-click-here" | transloco}}</a> 
                <!-- To generate <b>Central Govt. Employee</b> certificate - <a (click)="routeToCertEntryFn()" class="cursor-pointer">CLICK HERE</a>   -->
              </div>        
            </div>
          </div>
          <div class="col-12 lg:col-12 xl:col-12" *ngIf="rejectReason">
            {{"reject-reason" | transloco}} - <span style="color: red;">{{rejectReason}}</span>
          </div>
          <div class="col-12 lg:col-12 xl:col-12">
            <ion-radio-group [(ngModel)]="selectedRadioOption" (ngModelChange)="radioButtonClicked($event)">
              <div class="grid">
                <div class="col-12 m-0 p-0 lg:col-6">
                  <ion-item class="ion-no-padding" style="--padding-end: 0px;--inner-padding-end: 0px;">
                    <ion-label>&nbsp;&nbsp;&nbsp;{{"option-yes" | transloco}}</ion-label>
                    <ion-radio mode="md" slot="start" value="Yes"></ion-radio>
                  </ion-item>
                </div>
                <div class="col-12 m-0 p-0 lg:col-6">
                  <ion-item class="ion-no-padding" style="--padding-end: 0px;--inner-padding-end: 0px;">
                    <ion-label>&nbsp;&nbsp;&nbsp;{{"option-no" | transloco}}</ion-label>
                    <ion-radio mode="md" slot="start" value="No"></ion-radio>
                  </ion-item>
                </div>
              </div>
              &nbsp;&nbsp;&nbsp;
            </ion-radio-group>
          </div>
          <app-file-upload-cmp [uploadFileVisible]="uploadFileVisible" 
            [selectedImage]="selectedImage" [questionCode]="questionCode" 
            [ocrToBeDone]="ocrToBeDone" (evaluateProceedFn)="evaluateProceed()" (setOcrEntryKey)="setOcrEntryKey($event)"
            (setSelectedImage)="setSelectedImage($event)" (setOcrStatus)="setOcrStatus($event)"
            (setFileObj)="setFileObj($event)" [ocrFn]="callOcr"
            class="col-12"></app-file-upload-cmp>
        </div>
      </div>
      <div class="col-12 text-right">
        <button [style.fontWeight]="activeLang == 'mr' ? '600' : ''"
          [style.fontSize]="activeLang == 'mr' ? '18px' : ''" 
          [ngClass]="
            proceedEnabled == false
              ? 'disabled-button'
              : 'active-button flex-end'
          " [disabled]="proceedEnabled == false" (click)="proceed()" style="align-self:flex-end;">
          {{ "proceed" | transloco }}
        </button>
      </div>
    </div>
  </div>
</div>
