<div mat-dialog-content>
  <div class="grid m-0 p-0 video-dialog">
    <div class="col-10"></div>
    <div class="col-2 text-right">
      <ion-icon name="close" class="text-xl cursor-pointer" mat-dialog-close=""></ion-icon>
    </div>
    <div class="col-12 text-center">
      <iframe
        width="100%"
        height="315"
        [src]="videoSrc"
        title="YouTube video player"
        frameborder="0"
        allowfullscreen
      ></iframe>
    </div>
  </div>
</div>
