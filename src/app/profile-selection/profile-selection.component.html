<div class="grid m-0 p-0 background-image">
<div class="col-12 flex justify-content-center">
  <div class="col-12 md:col-8 lg:col-6 xl:col-5 bg-white p-6 option-card">
    <h3 class="text-center mt-0 mb-5">
        Choose an Option
      </h3>

        <div class="flex flex-column md:flex-row justify-content-center button-container">
        <button
          mat-raised-button
          color="primary"
          class="action-button"
          (click)="loadProfile()">

          <ion-icon name="person-circle-outline" class="mr-2"></ion-icon>
          Load Profile

        </button>

        <button
          mat-raised-button
          color="accent"
          class="action-button" 
          (click)="applyScheme()">

          <ion-icon name="document-text-outline" class="mr-2"></ion-icon>
          Apply Scheme

        </button>

      </div>

    </div>

  </div>
</div>
